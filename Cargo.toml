[package]
name = "tat"
version = "0.17.5"
edition = "2024"
description = "Repository-local Markdown task manager"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["cargo", "derive", "error-context", "help", "std", "suggestions", "usage"] }
rand = "0.9"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
